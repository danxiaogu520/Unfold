name: deterministic acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
        env:
          POSTGRES_USER: unfold
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: unfold
        ports:
          - 54318:5432
        options: >-
          --health-cmd "pg_isready -U unfold -d unfold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      UNFOLD_TEST_DATABASE_URL: postgresql+psycopg://unfold:test-only@127.0.0.1:54318/unfold
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.12.23
          python-version: 3.12.14
          enable-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --extra app
      - run: .venv/bin/python scripts/audit_publication.py --staged
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: .venv/bin/python scripts/check.py --browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deterministic-acceptance
          path: |
            .data/qa
            web/test-results
            web/playwright-report
          retention-days: 14
          include-hidden-files: true
