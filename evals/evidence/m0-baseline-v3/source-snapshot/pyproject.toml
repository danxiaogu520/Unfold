[project]
name = "unfold"
version = "0.0.1"
description = "知脉：学习生成契约与可复现评测"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5", "httpx==0.28.1", "jsonschema==4.25.1"]

[project.scripts]
unfold = "unfold.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.2", "mypy==1.18.2", "types-jsonschema==4.25.1.20251009"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
